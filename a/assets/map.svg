<title>Plan of the modelled theatre, state A, intact Roman hypothesis</title>
<desc>Outlines of the project's stylised model in metres (seating bands, stairs, floor, inner wall foot, stage). Not a survey drawing. Stage at the top; the arrow marks true north.</desc>
<style>.band{fill:#e8e2d6;fill-opacity:.13;stroke:#e8e2d6;stroke-opacity:.55;stroke-width:.22}
