.stair{fill:none;stroke:#cfc8bb;stroke-opacity:.7;stroke-width:.3;stroke-linecap:round}
.wall{fill:none;stroke:#f2ede4;stroke-opacity:.85;stroke-width:.55}
.stage{fill:#e8e2d6;fill-opacity:.16;stroke:#f2ede4;stroke-opacity:.9;stroke-width:.35}
.frons{fill:none;stroke:#f2ede4;stroke-width:.9}
.lbl{fill:#f2ede4;font-family:Inter,Arial,Helvetica,sans-serif;font-size:3.4px;letter-spacing:.06px}
.north{fill:#f2ede4;stroke:none}
.north-shaft{fill:none;stroke:#f2ede4;stroke-width:.45;stroke-linecap:round}
.north-ring{fill:none;stroke:#f2ede4;stroke-opacity:.45;stroke-width:.25}</style>
